[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alfred"
version = "0.2.0"
description = "ALFRED — AI Chief of Staff (Managed Agents + Prompt Caching)"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.52.0",
    "slack-bolt>=1.21.0",
    "slack-sdk>=3.33.0",
    "apscheduler>=3.10.4",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
    "beautifulsoup4>=4.12.0",
]

[tool.setuptools.packages.find]
include = ["alfred*"]
